[project]
name = "elotake-engine"
version = "0.1.0"
description = "Motor de edição automática de vídeo da Elotake"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Transcrição local com timestamps por palavra (baixa o modelo Whisper na 1ª execução).
transcricao = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
elotake = "elotake_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["elotake_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
